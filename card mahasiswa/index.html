<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Mahasiswa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 350px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .header {
            background-color: #1e3a8a;
            height: 110px;
            position: relative;
        }

        .foto {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid white;
            position: absolute;
            left: 50%;
            bottom: -55px;
            transform: translateX(-50%);
            object-fit: cover;
        }

        .content {
            text-align: center;
            padding: 70px 25px 25px;
        }

        .content h2 {
            color: #222;
            margin-bottom: 8px;
        }

        .content .nim {
            color: #777;
            margin-bottom: 20px;
        }

        .data {
            text-align: left;
            margin-top: 15px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #777;
        }

        .value {
            color: #222;
            font-weight: bold;
        }

        .button {
            display: block;
            margin-top: 20px;
            padding: 12px;
            background-color: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #162d6b;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">
            <img 
                src="foto diri.jpeg" 
                alt="Foto Mahasiswa"
                class="foto"
            >
        </div>

        <div class="content">

            <h2>Bima Mustaqim</h2>

            <p class="nim">NIM: 2441001</p>

            <div class="data">

                <div class="data-item">
                    <span class="label">Program Studi</span>
                    <span class="value">Informatika</span>
                </div>

                <div class="data-item">
                    <span class="label">Semester</span>
                    <span class="value">5</span>
                </div>

                <div class="data-item">
                    <span class="label">Status</span>
                    <span class="value">Aktif</span>
                </div>

            </div>

            <a href="#" class="button">Lihat Profil</a>

        </div>

    </div>

</body>
</html>
